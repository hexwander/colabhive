name: CI & Cross-Platform Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------------------
  # 1. Frontend Build & Typecheck (Vite + React + TypeScript + Tailwind)
  # ----------------------------------------------------------------------------
  frontend:
    name: Web Observatory (pnpm build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build production SPA bundle (web/dist)
        working-directory: web
        run: pnpm run build

      - name: Upload web/dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 2. Go Control Plane, Router, MCP & CLI Tests (-race)
  # ----------------------------------------------------------------------------
  backend:
    name: Go Backend (go vet & go test -race)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web/dist for go:embed
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module & static analysis
        run: |
          go mod verify
          go vet ./...

      - name: Run Go test suite with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -v -coverprofile=coverage.txt ./...

      - name: Verify pure-Go static binary compilation (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/colabhive ./cmd/colabhive
          if [ -d "./cmd/colab" ]; then
            go build -trimpath -ldflags="-s -w" -o bin/colab ./cmd/colab
          fi
          if [ -d "./cmd/colabhive-desktop" ]; then
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o bin/colabhive-desktop.exe ./cmd/colabhive-desktop
            GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/colabhive-desktop-darwin-arm64 ./cmd/colabhive-desktop
          fi

  # ----------------------------------------------------------------------------
  # 3. Python SDK & Contributor CLI (`colabhive-sdk`) Matrix
  # ----------------------------------------------------------------------------
  python-sdk:
    name: Python SDK (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run zero-dependency stdlib unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/sdk/python/src
        run: python -m unittest discover -s sdk/python/tests -v

      - name: Install optional httpx transport & build wheel/sdist
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e "sdk/python[httpx]"
          python -m unittest discover -s sdk/python/tests -v
          python -m build sdk/python

  # ----------------------------------------------------------------------------
  # 4. Cross-Platform Static Go Binary Matrix (Linux / macOS / Windows × amd64 + arm64)
  # ----------------------------------------------------------------------------
  build-matrix:
    name: Release Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [frontend, backend, python-sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            ext: ".exe"
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cross-platform static archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA::8}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STAGE_DIR="dist/colabhive_${GOOS}_${GOARCH}"
          mkdir -p "${STAGE_DIR}"

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
            -o "${STAGE_DIR}/colabhive${{ matrix.ext }}" \
            ./cmd/colabhive

          if [ -d "./cmd/colab" ]; then
            go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
              -o "${STAGE_DIR}/colab${{ matrix.ext }}" \
              ./cmd/colab
          elif [ "${{ matrix.archive }}" = "zip" ]; then
            cp "${STAGE_DIR}/colabhive.exe" "${STAGE_DIR}/colab.exe"
          else
            ln -s colabhive "${STAGE_DIR}/colab"
          fi

          if [ "${GOOS}" = "windows" ] && [ -d "./cmd/colabhive-desktop" ]; then
            go build \
              -trimpath \
              -ldflags="-s -w -H=windowsgui -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
              -o "${STAGE_DIR}/colabhive-desktop.exe" \
              ./cmd/colabhive-desktop
          elif [ "${GOOS}" = "darwin" ] && [ -d "./cmd/colabhive-desktop" ]; then
            go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
              -o "${STAGE_DIR}/colabhive-desktop" \
              ./cmd/colabhive-desktop
          fi

          cp LICENSE README.md README.zh-CN.md "${STAGE_DIR}/"
          mkdir -p "${STAGE_DIR}/web"
          cp -r web/dist "${STAGE_DIR}/web/dist"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -rq "colabhive_${VERSION}_${GOOS}_${GOARCH}.zip" "colabhive_${GOOS}_${GOARCH}")
            (cd dist && sha256sum "colabhive_${VERSION}_${GOOS}_${GOARCH}.zip" > "colabhive_${VERSION}_${GOOS}_${GOARCH}.zip.sha256")
          else
            tar -C dist -czf "dist/colabhive_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "colabhive_${GOOS}_${GOARCH}"
            (cd dist && sha256sum "colabhive_${VERSION}_${GOOS}_${GOARCH}.tar.gz" > "colabhive_${VERSION}_${GOOS}_${GOARCH}.tar.gz.sha256")
          fi

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 5. Native macOS Apple Silicon (`arm64`) & Intel (`amd64`) `ColabHive.app` + `.dmg`
  # ----------------------------------------------------------------------------
  macos-desktop:
    name: macOS Desktop App (darwin/${{ matrix.goarch }})
    runs-on: macos-14
    needs: [frontend, backend, python-sdk]
    strategy:
      fail-fast: false
      matrix:
        goarch: [arm64, amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet & Test macOS Cocoa/WKWebView Desktop Package (arm64 host)
        if: matrix.goarch == 'arm64'
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./internal/desktop/... ./cmd/colabhive-desktop/...
          go test -count=1 ./internal/desktop/... ./cmd/colabhive-desktop/...

      - name: Build Native ColabHive.app & DMG (${{ matrix.goarch }})
        env:
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-1.0.0}"
          CLEAN_VER="${VERSION#v}"
          case "${CLEAN_VER}" in
            [0-9]*) ;;
            *) CLEAN_VER="1.0.0" ;;
          esac
          COMMIT="${GITHUB_SHA::8}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"

          APP_STAGE="dist/macos-${TARGET_ARCH}/ColabHive.app"
          mkdir -p "${APP_STAGE}/Contents/MacOS" "${APP_STAGE}/Contents/Resources/web"

          # 1. Native Cocoa + WKWebView + Menu Bar NSPopover binary (CGO_ENABLED=1)
          CGO_ENABLED=1 GOOS=darwin GOARCH="${TARGET_ARCH}" \
            go build -trimpath -ldflags="${LDFLAGS}" \
            -o "${APP_STAGE}/Contents/MacOS/colabhive-desktop" \
            ./cmd/colabhive-desktop

          # 2. Bundled Control Plane & Drop-In CLI (`colabhive` + `colab`)
          CGO_ENABLED=0 GOOS=darwin GOARCH="${TARGET_ARCH}" \
            go build -trimpath -ldflags="${LDFLAGS}" \
            -o "${APP_STAGE}/Contents/MacOS/colabhive" \
            ./cmd/colabhive

          if [ -d "./cmd/colab" ]; then
            CGO_ENABLED=0 GOOS=darwin GOARCH="${TARGET_ARCH}" \
              go build -trimpath -ldflags="${LDFLAGS}" \
              -o "${APP_STAGE}/Contents/MacOS/colab" \
              ./cmd/colab
          else
            cp "${APP_STAGE}/Contents/MacOS/colabhive" "${APP_STAGE}/Contents/MacOS/colab"
          fi

          # 3. Generate multi-resolution Apple `AppIcon.icns` directly from pure Go
          CGO_ENABLED=0 go run ./cmd/colabhive-desktop \
            --write-icns "${APP_STAGE}/Contents/Resources/AppIcon.icns"

          # 4. Bundle production Observatory + Magpie `/tray` SPA assets
          cp -R web/dist "${APP_STAGE}/Contents/Resources/web/dist"

          # 5. Write macOS `Contents/Info.plist` (High-DPI Retina + Localhost WKWebView ATS)
          cat > "${APP_STAGE}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>ColabHive</string>
            <key>CFBundleDisplayName</key>
            <string>ColabHive</string>
            <key>CFBundleIdentifier</key>
            <string>com.colabhive.desktop</string>
            <key>CFBundleVersion</key>
            <string>${CLEAN_VER}</string>
            <key>CFBundleShortVersionString</key>
            <string>${CLEAN_VER}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>colabhive-desktop</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsLocalNetworking</key>
              <true/>
            </dict>
          </dict>
          </plist>
          EOF

          # 6. Ad-hoc codesign bundle (mandatory for Apple Silicon arm64 execution)
          codesign --force --deep --sign - "${APP_STAGE}"

          # 7. Package `ColabHive_macOS_<arch>.app.zip` & `ColabHive_macOS_<arch>.dmg`
          mkdir -p dist
          ZIP_NAME="ColabHive_macOS_${TARGET_ARCH}.app.zip"
          DMG_NAME="ColabHive_macOS_${TARGET_ARCH}.dmg"

          ditto -c -k --sequesterRsrc --keepParent "${APP_STAGE}" "dist/${ZIP_NAME}"

          DMG_ROOT="dist/dmg-${TARGET_ARCH}"
          mkdir -p "${DMG_ROOT}"
          cp -R "${APP_STAGE}" "${DMG_ROOT}/ColabHive.app"
          ln -s /Applications "${DMG_ROOT}/Applications"
          hdiutil create -volname "ColabHive" -srcfolder "${DMG_ROOT}" -ov -format UDZO "dist/${DMG_NAME}"
          rm -rf "${DMG_ROOT}"

          (cd dist && shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256")
          (cd dist && shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256")

      - name: Upload macOS `.app.zip` & `.dmg` artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-desktop-${{ matrix.goarch }}
          path: |
            dist/ColabHive_macOS_*.app.zip*
            dist/ColabHive_macOS_*.dmg*
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 6. Publish GitHub Release on Tag Push (`v*`)
  # ----------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-matrix, macos-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Combine SHA256SUMS
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
