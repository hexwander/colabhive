# ==============================================================================
# ColabHive — Production Cloud Team Stack (`docker-compose.cloud.yml`)
# ==============================================================================
# Hardened multi-user / remote-agent deployment running `--mode cloud --trust-proxy`:
#   • Enforces `COLABHIVE_ADMIN_TOKEN` on Web Observatory & admin `/api/v1/*` routes
#   • Encrypts all Google OAuth refresh/access tokens at rest with `COLABHIVE_MASTER_KEY`
#   • Authenticates remote AI Coding Agents on `/mcp` via scoped `ch_sk_...` API keys
#   • Disables host-filesystem endpoints (`scan-local`, host config inject, desktop tray)
#   • Keeps Public Guest Contributor Portal (`/contribute/:code`) open for 30s CU donation
#
# Quick Launch (Option 1 — With Built-in Caddy Auto-HTTPS Companion):
#   cp .env.cloud.example .env.cloud   # fill DOMAIN, ADMIN_TOKEN & MASTER_KEY
#   docker compose --env-file .env.cloud -f docker-compose.cloud.yml --profile caddy up -d
#
# Quick Launch (Option 2 — Behind Existing Host Nginx / Cloudflare Tunnel):
#   cp .env.cloud.example .env.cloud
#   docker compose --env-file .env.cloud -f docker-compose.cloud.yml up -d
#   # Upstream listens on 127.0.0.1:7860 -> pair with `deploy/nginx.conf`
# ==============================================================================

services:
  colabhive:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${COLABHIVE_VERSION:-1.0.0}
    image: ghcr.io/colabhive/colabhive:${COLABHIVE_TAG:-latest}
    container_name: colabhive-cloud
    restart: unless-stopped
    command:
      - "serve"
      - "--mode"
      - "cloud"
      - "--trust-proxy"
    # Bind to loopback by default so public traffic always traverses TLS reverse proxy.
    # Set COLABHIVE_BIND_ADDR=0.0.0.0 only inside private VPC/Tailscale networks.
    ports:
      - "${COLABHIVE_BIND_ADDR:-127.0.0.1}:${COLABHIVE_BIND_PORT:-7860}:7860"
    volumes:
      - colabhive_cloud_data:/data
    environment:
      # Cloud Mode & Reverse-Proxy Header Trust (`X-Forwarded-Proto`, `X-Forwarded-For`)
      COLABHIVE_MODE: "cloud"
      COLABHIVE_TRUST_PROXY: "true"
      COLABHIVE_HOST: "0.0.0.0"
      COLABHIVE_PORT: "7860"
      COLABHIVE_DATA_DIR: "/data"
      COLABHIVE_DB_PATH: "/data/colabhive.db"
      COLABHIVE_WEB_DIR: "/app/web/dist"
      TZ: "${TZ:-UTC}"

      # Mandatory Cloud Security Secrets (fail fast if unset!)
      # Generate each secret with: openssl rand -hex 32
      COLABHIVE_ADMIN_TOKEN: "${COLABHIVE_ADMIN_TOKEN:?Set COLABHIVE_ADMIN_TOKEN in .env.cloud (openssl rand -hex 32)}"
      COLABHIVE_MASTER_KEY: "${COLABHIVE_MASTER_KEY:?Set COLABHIVE_MASTER_KEY in .env.cloud (openssl rand -hex 32)}"

      # Canonical HTTPS Base URL for Shareable Contributor Links (`/contribute/:code`)
      COLABHIVE_PUBLIC_URL: "${COLABHIVE_PUBLIC_URL:?Set COLABHIVE_PUBLIC_URL in .env.cloud (e.g. https://hive.lab.example.com)}"

      # Smart Router & Anti-Zombie Watchdog Policy
      COLABHIVE_DEFAULT_STRATEGY: "${COLABHIVE_DEFAULT_STRATEGY:-waste-zero}"
      COLABHIVE_KEEPALIVE_INTERVAL_SEC: "${COLABHIVE_KEEPALIVE_INTERVAL_SEC:-8}"
      COLABHIVE_ANTI_ZOMBIE_WATCHDOG: "${COLABHIVE_ANTI_ZOMBIE_WATCHDOG:-true}"

      # Optional: Custom Google OAuth Web Client for 1-Click HTTPS Callback
      # (Leave blank to use Google Cloud SDK zero-domain remote PKCE copy-paste flow)
      COLABHIVE_OAUTH_CLIENT_ID: "${COLABHIVE_OAUTH_CLIENT_ID:-}"
      COLABHIVE_OAUTH_CLIENT_SECRET: "${COLABHIVE_OAUTH_CLIENT_SECRET:-}"
    networks:
      - colabhive_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7860/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Optional Companion: Caddy v2 Automatic HTTPS Reverse Proxy (`--profile caddy`)
  #   • Provisions & renews Let's Encrypt / ZeroSSL TLS certificates automatically
  #   • Streams `/mcp` with `flush_interval -1` & `1800s` GPU timeout
  #   • Upgrades `/ws/events` WebSockets seamlessly
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: colabhive-caddy
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      colabhive:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      COLABHIVE_DOMAIN: "${COLABHIVE_DOMAIN:-localhost}"
      COLABHIVE_UPSTREAM: "colabhive:7860"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - colabhive_net

networks:
  colabhive_net:
    driver: bridge

volumes:
  colabhive_cloud_data:
    name: colabhive_cloud_data
  caddy_data:
    name: colabhive_caddy_data
  caddy_config:
    name: colabhive_caddy_config
