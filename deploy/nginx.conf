# ==============================================================================
# ColabHive — Production Nginx Reverse Proxy Config (`deploy/nginx.conf`)
# ==============================================================================
# Standalone full configuration (`/etc/nginx/nginx.conf` or Docker mount).
# If including inside an existing `/etc/nginx/conf.d/colabhive.conf`, copy only
# the `map`, `upstream`, and `server` blocks inside `http { ... }`.
#
# Key Production Requirements for ColabHive (`--mode cloud --trust-proxy`):
#   1. `/mcp` & `/mcp/*` : `proxy_buffering off` + `X-Accel-Buffering: no` +
#      `proxy_read_timeout 1800s` for Streamable HTTP & SSE MCP agents.
#   2. `/ws/events`      : HTTP/1.1 `Upgrade: websocket` + `3600s` read timeout.
#   3. `/api/v1/*`       : `1800s` read timeout so cold-start GPU provisioning,
#      cross-account waterfall failover & `colabhive run` never 504 timeout.
#   4. `X-Forwarded-Proto` & `X-Forwarded-Host` passed cleanly so public
#      Contributor Invite URLs (`/contribute/:code`) resolve to `https://...`.
# ==============================================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;
    server_tokens   off;

    # Map WebSocket Upgrade header cleanly to Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ColabHive Control Plane upstream
    # Change `127.0.0.1:7860` to `colabhive:7860` when Nginx runs inside Docker Compose
    upstream colabhive_backend {
        server 127.0.0.1:7860;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP (:80) -> ACME Challenge + Permanent HTTPS Redirect
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name hive.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS (:443) -> ColabHive Cloud Team Server
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name hive.example.com;

        # Replace with your Let's Encrypt / ACME / enterprise TLS certificates
        ssl_certificate     /etc/letsencrypt/live/hive.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hive.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Support dataset / checkpoint uploads to `/content` & `.chvault` imports
        client_max_body_size 512m;

        # Common proxy forwarding headers (consumed by ColabHive `--trust-proxy`)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ----------------------------------------------------------------------
        # 1. AI Agent MCP Endpoint (`/mcp`, `/mcp/sse`, `/mcp/messages`)
        #    Streamable HTTP (2025-03-26 / 2025-06-18) & Legacy SSE (2024-11-05)
        # ----------------------------------------------------------------------
        location ^~ /mcp {
            proxy_pass http://colabhive_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            # CRITICAL: Disable all Nginx buffering/caching/gzip for live SSE & JSON-RPC streams
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            gzip off;
            chunked_transfer_encoding on;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Accel-Buffering "no" always;

            # 30-minute timeout for GPU cold-start provisioning & long code cells
            proxy_connect_timeout 60s;
            proxy_read_timeout    1800s;
            proxy_send_timeout    1800s;
        }

        # ----------------------------------------------------------------------
        # 2. Real-Time Telemetry & Live Workbench Terminal WebSocket (`/ws/events`)
        # ----------------------------------------------------------------------
        location = /ws/events {
            proxy_pass http://colabhive_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
        }

        # ----------------------------------------------------------------------
        # 3. Control-Plane REST API (`/api/v1/*`)
        #    1800s read timeout covers GPU assign, waterfall failover & sharded runs
        # ----------------------------------------------------------------------
        location ^~ /api/v1/ {
            proxy_pass http://colabhive_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_read_timeout    1800s;
            proxy_send_timeout    1800s;
        }

        # ----------------------------------------------------------------------
        # 4. Public Guest Contributor API (`/api/public/contribute/*`)
        # ----------------------------------------------------------------------
        location ^~ /api/public/ {
            proxy_pass http://colabhive_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            proxy_connect_timeout 30s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }

        # ----------------------------------------------------------------------
        # 5. Web Observatory SPA & Contributor Portal (`/contribute/:code`, `/c/:code`)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://colabhive_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            gzip on;
            gzip_types text/plain text/css application/json application/javascript image/svg+xml;

            proxy_connect_timeout 15s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }
    }
}
